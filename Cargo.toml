[package]
name = "me-80-patch-editor"
default-run = "me-80-patch-editor"
version = "0.2.0"
description = "Native Windows patch editor and librarian for the BOSS ME-80"
authors = ["me-80-patch-editor contributors"]
edition = "2021"

[lib]
name = "me_80_patch_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
midir = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
